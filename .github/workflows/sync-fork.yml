name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 * * * *' # يتم التشغيل تلقائياً كل ساعة
  workflow_dispatch:      # زر للتشغيل اليدوي متى ما أردت

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Fork
        run: gh repo sync ${{ github.repository }} -b main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
